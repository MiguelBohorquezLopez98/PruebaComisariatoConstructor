<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Gestor de Solicitudes</mat-card-title>
      <mat-card-subtitle>Inicia sesion para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="nombreUsuario" placeholder="admin" />
          @if (form.get('nombreUsuario')?.hasError('required')) {
            <mat-error>El usuario es obligatorio</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contrasena</mat-label>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" />
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (form.get('password')?.hasError('required')) {
            <mat-error>La contrasena es obligatoria</mat-error>
          }
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="full-width"
          type="submit"
          [disabled]="loading || form.invalid"
        >
          @if (loading) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Iniciar Sesion
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
